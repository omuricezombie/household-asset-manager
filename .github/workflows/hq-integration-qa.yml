name: Baby HQ integration QA
on:
  push:
    branches: ['experiment/hq-baby-integration-20261125', 'candidate', 'main']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tests/hq_static_qa.py
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python tests/hq_browser_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: household-v0248-qa
          path: |
            AI_QA_0248.json
            hq-baby-manifest.json
          retention-days: 30
  release:
    if: github.ref == 'refs/heads/main'
    needs: qa
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: household-v0248-qa
          path: qa-result
      - name: Fix v0.2.48 tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(node -e "const fs=require('fs');process.stdout.write(fs.readFileSync('db.js','utf8').match(/const APP_VERSION='([^']+)'/)[1])")" = "0.2.48"
          existing_sha=$(git ls-remote origin refs/tags/v0.2.48 | cut -f1)
          if [ -n "$existing_sha" ]; then
            test "$existing_sha" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/v0.2.48 -f sha="$GITHUB_SHA"
          fi
          git archive --format=zip --prefix=household-asset-manager/ --output=household_v0_2_48_stable.zip "$GITHUB_SHA"
          if gh release view v0.2.48 >/dev/null 2>&1; then
            echo "Release already exists at verified tag; preserving it."
          else
            gh release create v0.2.48 household_v0_2_48_stable.zip qa-result/AI_QA_0248.json qa-result/hq-baby-manifest.json --verify-tag --title "v0.2.48 — 幼体5種族高画質化" --notes-file RELEASE_v0.2.48.md
          fi
