name: Teen integration and existing baby / HQ regression QA
on:
  push:
    branches: ['candidate', 'main']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Historical stable provenance (unchanged assertions)
        run: |
          git worktree add --detach "$RUNNER_TEMP/ham-stable" e0907a4502d78375610df88d8c66626a772876f8
          cd "$RUNNER_TEMP/ham-stable"
          python tests/analysis_swipe_static_qa.py
          python tests/teen_integration_static_qa.py
          python tests/hq_static_qa.py
          python tests/brush_static_qa.py
          cp AI_QA_0253*.json "$GITHUB_WORKSPACE/"
      - run: python tests/pet_room_static_qa.py
      - run: python tests/build_growth_standalone.py
      - run: python -m pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: python tests/pet_room_idb_qa.py
      - run: node tests/pet_room_store_mock.cjs
      - run: python tests/analysis_swipe_browser_qa.py
      - run: python tests/hq_browser_qa.py
      - run: python tests/build_brush_standalone.py
      - run: python tests/brush_browser_qa.py
      - run: python tests/fairy_face_qa.py
      - run: python tests/ball_browser_qa.py
      - run: node tests/sleep_controller_qa.cjs
      - run: node tests/sleep_integration_qa.cjs
      - run: python tests/sleep_browser_qa.py
      - run: python tests/build_teen_standalone.py
      - run: python tests/teen_live_browser_qa.py
      - run: python tests/pet_room_browser_mock.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-v0254c1-qa
          path: |
            AI_QA_0253*.json
            AI_QA_0254*.json
            artifacts/cache-diagnostics.json
            teen-art-manifest.json
            artifacts/brush-contact-internal.png
            artifacts/brush-fairy-*.png
            artifacts/fairy-hair-only-*.png
            artifacts/brush-yokai-*.png
            artifacts/brush-dino-*.png
            hq-baby-manifest.json
            hq-growth-manifest.json
          retention-days: 30
