name: Growth HQ integration QA
on:
  push:
    branches: ['candidate', 'main']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tests/hq_static_qa.py
      - run: python tests/build_growth_standalone.py
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python tests/hq_browser_qa.py
      - name: Package candidate code and QA
        run: |
          git archive --format=zip --prefix=household-asset-manager/ --output=artifacts/household_v0_2_49_stable.zip HEAD
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('artifacts/household_v0_2_49_stable.zip','a',zipfile.ZIP_DEFLATED) as z:
            for name in ['AI_QA_0249.json','AI_QA_0249_static.json']:
              z.write(name,'household-asset-manager/'+name)
          PY
      - name: Check candidate delivery hosts
        if: success()
        continue-on-error: true
        run: |
          python - <<'PY'
          import urllib.request,json,hashlib,os
          from pathlib import Path
          sha=os.environ['GITHUB_SHA'];base='omuricezombie/household-asset-manager/'+sha+'/'
          results=[]
          for host in ['raw.githack.com','rawcdn.githack.com']:
            url='https://'+host+'/'+base+'hq-integration-qa.html?v=0249'
            try:
              r=urllib.request.urlopen(url,timeout=20);b=r.read();ok=r.status==200 and 'text/html' in r.headers.get('Content-Type','') and b==Path('hq-integration-qa.html').read_bytes()
              results.append({'url':url,'status':r.status,'exact_html':ok})
            except Exception as e:results.append({'url':url,'error':str(e)})
          Path('artifacts/delivery-hosts.json').write_text(json.dumps(results,indent=2));print(json.dumps(results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: household-v0249-growth-qa
          path: |
            AI_QA_0249*.json
            hq-growth-manifest.json
            hq-baby-manifest.json
            artifacts/
          retention-days: 30
