name: Baby brushing and HQ regression QA
on:
  push:
    branches: ['candidate', 'main']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tests/hq_static_qa.py
      - run: python tests/brush_static_qa.py
      - run: python tests/build_growth_standalone.py
      - run: python -m pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: python tests/hq_browser_qa.py
      - run: python tests/build_brush_standalone.py
      - run: python tests/brush_browser_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brushing-v0250c1-qa
          path: |
            AI_QA_0250c1*.json
            artifacts/brush-contact-internal.png
          retention-days: 30
