name: Growth stage Real-ESRGAN comparison QA
on:
  push:
    branches: ['experiment/sr-growth-20261125']
    paths: ['.github/workflows/sr-growth-qa.yml','experiments/sr_growth.py','experiments/sr_growth_compare.py']
permissions:
  contents: read
jobs:
  upscale:
    strategy:
      fail-fast: false
      matrix:
        species: [animal, fantasy, fairy, yokai, dino]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'numpy<3' pillow scipy
      - run: python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m py_compile experiments/sr_growth.py experiments/sr_growth_compare.py
      - run: python experiments/sr_growth.py --species ${{ matrix.species }}
      - uses: actions/upload-artifact@v4
        with:
          name: growth-${{ matrix.species }}
          path: sr-growth/
          retention-days: 14
  compare:
    needs: upscale
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: growth-*
          path: sr-growth
          merge-multiple: true
      - run: python -m pip install pillow playwright && python -m playwright install --with-deps chromium
      - run: python experiments/sr_growth_compare.py
      - uses: actions/upload-artifact@v4
        with:
          name: growth-comparison-qa
          path: |
            growth-result/
            sr-growth/
            experiments/sr_growth.py
            experiments/sr_growth_compare.py
          retention-days: 14
