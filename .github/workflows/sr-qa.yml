name: Four remaining baby species Real-ESRGAN QA
on:
  push:
    branches: ['experiment/sr-model-qa-20261125']
    paths: ['.github/workflows/sr-qa.yml','experiments/sr_other_babies.py']
permissions:
  contents: read
jobs:
  upscale:
    strategy:
      fail-fast: false
      matrix:
        species: [dino, fantasy, yokai, fairy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'numpy<3' pillow scipy opencv-contrib-python-headless==4.12.0.88
      - run: python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - if: matrix.species == 'yokai'
        run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python experiments/sr_other_babies.py --model realesrgan --species ${{ matrix.species }}
      - uses: actions/upload-artifact@v4
        with:
          name: sr-${{ matrix.species }}-full
          path: sr-${{ matrix.species }}-full/
          retention-days: 7
