name: Animal baby full Real-ESRGAN QA
on:
  push:
    branches: ['experiment/sr-model-qa-20261125']
    paths: ['.github/workflows/sr-qa.yml','experiments/sr_animal_full.py']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'numpy<3' pillow scipy opencv-contrib-python-headless==4.12.0.88
      - run: python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - run: python experiments/sr_animal_full.py --model realesrgan
      - uses: actions/upload-artifact@v4
        with:
          name: sr-animal-full
          path: sr-animal-full/
          retention-days: 7
