<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>中間体・成体 HQ 比較 r1</title>
<style>/*PRODUCTION_CSS*/</style>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f1;color:#243b34;font:15px/1.6 system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:16px}h1{font-size:21px;margin:0 0 6px}h2{font-size:18px}p{margin:6px 0 12px}.controls{position:sticky;top:0;z-index:10;background:#f2f5f1f5;border-bottom:1px solid #bccfc1;padding:10px 0;display:flex;flex-wrap:wrap;gap:10px}label{display:flex;align-items:center;gap:6px}select{font:inherit;min-height:44px;max-width:200px;border:1px solid #98b5a8;border-radius:8px;background:white;padding:5px}#status{min-height:24px}.directions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:12px}.card{border:1px solid #c1d2c5;background:#fff;border-radius:12px;padding:10px;min-width:0}.card h3{font-size:16px;margin:0}.scroll{overflow-x:auto;overscroll-behavior-x:contain}.pair{display:flex;gap:6px;width:max-content;margin:auto}.sample{flex:none;text-align:center}.caption{display:block;font-size:13px}.viewport{position:relative;width:calc(180px * var(--zoom));height:calc(204px * var(--zoom));overflow:hidden;background:var(--surface);border-radius:8px}.geometry{position:absolute;left:0;top:0;width:180px;height:204px;transform:scale(var(--zoom));transform-origin:0 0}.geometry .pet-character{position:absolute;left:17px;top:24px;margin:0;animation:none!important;scale:var(--context-scale);transform-origin:50% 88%}.geometry .pet-character *{animation:none!important;transition:none!important}.geometry .pet-art-image:not(:first-child),.geometry .pet-art-emote,.geometry .pet-care-chew,.geometry .pet-care-food{display:none!important}.geometry .pet-character .pet-unified .pet-art-image:first-child{background-image:var(--sheet)!important;background-size:400% var(--rows)!important;background-position:var(--x) var(--y)!important;transform:none!important}.growth{display:flex;gap:12px;width:max-content;margin:auto}#growth-wrap{padding:12px;border:1px solid #c1d2c5;background:white;border-radius:12px}.hq-only .original{display:none}.note{font-size:13px;color:#486355}.error{color:#9d2929}button{font:inherit;min-height:44px}footer{margin-top:20px}
</style>
<main><h1>中間体・成体の高画質化比較 r1</h1><p>5種族・40コマ。基本イラストのみの静止比較です。本番 v0.2.48 の表示枠・座標を使用しています。</p>
<div class="controls">
<label>種族<select id="species"><option value="animal">動物風</option><option value="fantasy">架空の生き物</option><option value="fairy">妖精風</option><option value="yokai">妖怪</option><option value="dino">恐竜</option></select></label>
<label>段階<select id="stage"><option value="teen">中間体</option><option value="adult">成体</option></select></label>
<label>表示<select id="mode"><option value="compare">現行と高画質版</option><option value="hq">高画質版のみ</option></select></label>
<label>表示場所<select id="context"><option value="0.8">部屋</option><option value="1.12">ホーム</option><option value="1">選択一覧</option></select></label>
<label>倍率<select id="zoom"><option value="1">本番相当（1倍）</option><option value="2">2倍</option><option value="3">3倍</option></select></label>
<label>背景<select id="background"><option value="#dfebd8">淡い緑</option><option value="#ffffff">白</option><option value="#29473f">濃い緑</option></select></label>
</div><p id="status" role="status">画像を準備中…</p><div id="directions" class="directions"></div>
<h2>幼体 → 中間体 → 成体</h2><p class="note">採用済み幼体HQと同じ方向で並べます。横にスクロールできます。</p>
<label>成長比較の方向<select id="growth-direction"><option value="0">正面</option><option value="1">左</option><option value="2">背面</option><option value="3">右</option></select></label>
<div id="growth-wrap" class="scroll"><div id="growth" class="growth"></div></div>
<footer class="note">基準枠160×180px（部屋は0.8倍、ホームは1.12倍、選択一覧は1倍）／原画320×360px → HQ640×720px。元の透過形状を2倍へ再サンプリング。幼体素材は再生成・再圧縮していません。家計データの読込・保存や通信は行いません。</footer>
</main><script id="payload" type="application/json">/*PAYLOAD*/</script>
<script>/*RENDERER*/</script>
<script>
'use strict';
const speciesList=['animal','fantasy','fairy','yokai','dino'],stages=['baby','teen','adult'],dirs=['front','left','back','right'],dirNames=['正面','左','背面','右'],stageNames={baby:'幼体（採用済み）',teen:'中間体',adult:'成体'};
const payload=JSON.parse(document.getElementById('payload').textContent);document.getElementById('payload').remove();
const urls=new Map(),$=id=>document.getElementById(id);let ticket=0;window.qaReady=false;
function asset(key){if(!urls.has(key)){const raw=atob(payload[key]),a=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);urls.set(key,URL.createObjectURL(new Blob([a],{type:'image/webp'})));}return urls.get(key);}
function sample(type,stage,direction,hq){
 const box=document.createElement('div');box.className='sample '+(hq?'enhanced':'original');box.dataset.stage=stage;box.dataset.direction=dirs[direction];box.dataset.kind=hq?'hq':'original';
 const key=hq?type+'-'+stage:'original';const row=speciesList.indexOf(type)*3+stages.indexOf(stage);
 box.innerHTML='<span class="caption">'+(hq?'高画質版':'現行画像')+'</span><div class="viewport"><div class="geometry"><div class="pet-character" data-growth="'+stage+'">'+HAM.PetIllustration.draw({type,stage,direction:dirs[direction]})+'</div></div></div>';
 box.style.setProperty('--sheet','url("'+asset(key)+'")');box.style.setProperty('--rows',hq?'100%':'1500%');box.style.setProperty('--x',(direction*100/3)+'%');box.style.setProperty('--y',hq?'0%':(row*100/14)+'%');return box;
}
async function render(){const seq=++ticket;window.qaReady=false;const type=$('species').value,stage=$('stage').value;
 document.body.style.setProperty('--context-scale',$('context').value);document.body.style.setProperty('--zoom',$('zoom').value);document.body.style.setProperty('--surface',$('background').value);document.body.classList.toggle('hq-only',$('mode').value==='hq');
 $('status').textContent='画像を準備中…';$('directions').replaceChildren();$('growth').replaceChildren();
 // Only selected species sheets and original atlas are referenced or decoded.
 const keep=new Set(['original',...stages.map(s=>type+'-'+s)]);for(const [k,u]of urls)if(!keep.has(k)){URL.revokeObjectURL(u);urls.delete(k);}
 try{await Promise.all([...keep].map(async key=>{const im=new Image();im.src=asset(key);await im.decode();if(!im.naturalWidth)throw Error(key);}));if(seq!==ticket)return;
 for(let d=0;d<4;d++){const card=document.createElement('section');card.className='card';card.innerHTML='<h3>'+dirNames[d]+'</h3><div class="scroll"><div class="pair"></div></div>';const pair=card.querySelector('.pair');if($('mode').value!=='hq')pair.append(sample(type,stage,d,false));pair.append(sample(type,stage,d,true));$('directions').append(card);}
 for(const s of stages){const col=document.createElement('section');col.innerHTML='<strong>'+stageNames[s]+'</strong>';col.append(sample(type,s,Number($('growth-direction').value),true));$('growth').append(col);}
 $('status').textContent='表示完了｜'+$('species').selectedOptions[0].text+'・'+stageNames[stage]+'｜全4方向';window.qaReady=true;
 }catch(e){if(seq!==ticket)return;$('status').textContent='画像の表示に失敗しました：'+e.message;$('status').className='error';throw e;}
}
for(const id of ['species','stage','mode','zoom','background','growth-direction','context'])$(id).addEventListener('change',render);
window.addEventListener('pagehide',()=>{for(const u of urls.values())URL.revokeObjectURL(u);urls.clear();});window.addEventListener('pageshow',e=>{if(e.persisted)render();});render();
</script></html>
