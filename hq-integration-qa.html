<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幼体HQ統合QA｜v0.2.48</title><link rel="stylesheet" href="pet-game.css?v=0248"><link rel="stylesheet" href="pet-hq.css?v=0248"><style>body{font:16px system-ui;background:#101824;color:#eee;padding:12px}main{max-width:600px;margin:auto}button,select{font:inherit;padding:10px;margin:3px}h1{font-size:20px}.pet-stage{min-height:205px}</style><main><h1>幼体5種族HQ統合｜v0.2.48</h1><p>アプリ本体と同じCSS・画像・描画処理を使用。保存なし。</p><select id="species"><option value="animal">動物風</option><option value="dino">恐竜</option><option value="fantasy">架空の生き物</option><option value="yokai">妖怪</option><option value="fairy">妖精</option></select><nav id="directions"><button data-dir="front">正面</button><button data-dir="left">左</button><button data-dir="back">背面</button><button data-dir="right">右</button></nav><nav id="moods"><button data-mood="idle">待機</button><button data-mood="pet">なでる</button><button data-mood="food">ごはん</button><button data-mood="calm">見守る</button></nav><div class="pet-room" data-room-type="animal"><div class="pet-stage"><span class="pet-character pet-mood-idle" data-growth="baby" data-type="animal" data-facing="front"></span></div></div><p id="status"></p><p><a href="index.html?v=0248">アプリ本体を開く</a></p></main><script src="pet-illustration.js?v=0248"></script><script>
let type='animal',dir='front',mood='idle',timer;const ch=document.querySelector('.pet-character');
function paint(restart=false){let facing=mood==='idle'?dir:'front';for(let k of ['idle','pet','food','calm'])ch.classList.toggle('pet-mood-'+k,k===mood);if(ch.dataset.type!==type||ch.dataset.facing!==facing||!ch.firstChild){ch.dataset.type=type;ch.dataset.facing=facing;ch.innerHTML=HAM.PetIllustration.draw({type,stage:'baby',direction:facing,mood})}if(restart)for(let a of ch.querySelector('.pet-illustration').getAnimations({subtree:true}))if(a.animationName?.startsWith('pet247-care-')){a.currentTime=0;a.play()}document.querySelector('.pet-room').dataset.roomType=type;document.querySelector('#status').textContent=type+' / '+facing+' / '+mood}
document.querySelector('#species').onchange=e=>{clearTimeout(timer);type=e.target.value;mood='idle';paint()};document.querySelector('#directions').onclick=e=>{if(!e.target.dataset.dir)return;clearTimeout(timer);dir=e.target.dataset.dir;mood='idle';paint()};document.querySelector('#moods').onclick=e=>{if(!e.target.dataset.mood)return;clearTimeout(timer);mood=e.target.dataset.mood;paint(true);if(mood!=='idle')timer=setTimeout(()=>{mood='idle';paint()},mood==='calm'?3200:1700)};paint();</script></html>
